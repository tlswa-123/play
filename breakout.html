<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
#wrap{position:relative;width:480px;height:640px}
canvas{width:100%;height:100%;border-radius:8px;box-shadow:0 0 60px rgba(40,120,200,0.12)}
#hud{position:absolute;top:12px;left:0;width:100%;display:flex;justify-content:center;gap:28px;color:#6a8da8;font-size:12px;letter-spacing:1.5px;z-index:5;pointer-events:none}
#hud span{display:flex;align-items:center;gap:5px}
#hud .val{color:#5ecfe8;font-size:15px;font-weight:700}
#speedWrap{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:5;pointer-events:none}
#speedWrap span{color:#4a6a80;font-size:10px;letter-spacing:1px}
#speedBar{width:80px;height:2px;background:rgba(255,255,255,0.05);border-radius:1px}
#speedFill{height:100%;background:linear-gradient(90deg,#2e6b8a,#e8556d);border-radius:1px;width:0%;transition:width .5s}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;z-index:10}
#ui.active{pointer-events:auto}
.overlay{display:none;flex-direction:column;align-items:center;gap:18px;color:#c0d8e8}
.overlay.show{display:flex}
.overlay h1{font-size:36px;font-weight:200;letter-spacing:8px;color:#5ecfe8;text-transform:uppercase}
.overlay h2{font-size:24px;font-weight:300;letter-spacing:5px;color:#e8556d}
.overlay p{font-size:13px;color:#5a7a90;letter-spacing:1px;line-height:1.6}
.overlay .legend{display:flex;gap:14px;margin:6px 0}
.overlay .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;vertical-align:middle}
.legend span{font-size:11px;color:#5a7a90;letter-spacing:1px;display:flex;align-items:center;gap:4px}
.btn{padding:12px 44px;border:1.5px solid #2e6b8a;background:transparent;color:#5ecfe8;font-size:14px;letter-spacing:4px;cursor:pointer;border-radius:3px;transition:all .2s;pointer-events:auto;margin-top:4px}
.btn:hover{background:#2e6b8a;color:#e0f0ff;box-shadow:0 0 24px rgba(46,107,138,0.35)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
  <span>得分 <b class="val" id="scoreVal">0</b></span>
  <span>生命 <b class="val" id="livesVal">3</b></span>
  <span>连击 <b class="val" id="comboVal">0</b></span>
</div>
<div id="speedWrap"><span>速度</span><div id="speedBar"><div id="speedFill"></div></div></div>
<div id="ui" class="active">
  <div class="overlay show" id="startScreen">
    <h1>打砖块</h1>
    <div class="legend">
      <span><i style="background:#3481a8"></i>普通</span>
      <span><i style="background:#8255c0"></i>硬质×2</span>
      <span><i style="background:#d94e63"></i>爆炸</span>
    </div>
    <p>鼠标 / 触屏 / 方向键 控制挡板</p>
    <button class="btn" onclick="startGame()">开始</button>
  </div>
  <div class="overlay" id="overScreen">
    <h2>游戏结束</h2>
    <p id="finalScore">得分: 0</p>
    <button class="btn" onclick="startGame()">再来一局</button>
  </div>
  <div class="overlay" id="winScreen">
    <h1>通关</h1>
    <p id="winScore">得分: 0</p>
    <button class="btn" onclick="startGame()">再玩一次</button>
  </div>
</div>
</div>
<script>
const cvs=document.getElementById('game');
const ctx=cvs.getContext('2d');
const W=480,H=640;
cvs.width=W;cvs.height=H;

// ===== 冷色调色板 =====
const C={
  bg1:'#0b1018',bg2:'#101828',
  paddle:'#2e6b8a',paddleHi:'#3a97c6',paddleGlow:'rgba(58,151,198,0.2)',
  ball:'#d8eeff',ballGlow:'rgba(94,207,232,0.3)',
  normal:[
    ['#1e4a64','#25607a','#2b7690'],
    ['#1b4d6e','#226488','#287ba2'],
    ['#17455e','#1d5a74','#23708a']
  ],
  hard:['#5a3380','#7040a0','#8a50c0'],
  hardHit:['#7a53a0','#9468c0','#ae7de0'],
  explosive:['#a83040','#c43850','#e04868'],
  particle:['#5ecfe8','#3a97c6','#e05878','#8a50c0','#2b7690','#ffd060']
};

// ===== 音频 =====
let ac;
function ea(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}

function tone(f,d,t='sine',v=0.12,dt=0){
  ea();const o=ac.createOscillator(),g=ac.createGain();
  o.type=t;o.frequency.value=f;o.detune.value=dt;
  g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}

function noise(d,v,lp=800){
  ea();
  const buf=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate);
  const dd=buf.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,2);
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  s.buffer=buf;f.type='lowpass';f.frequency.value=lp;
  g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}

function sfxNormal(){tone(660,0.08,'sine',0.1);tone(990,0.06,'sine',0.05);}
function sfxHard(){tone(330,0.1,'square',0.07);tone(440,0.08,'square',0.04);}
function sfxExplode(){noise(0.3,0.2,800);tone(160,0.2,'sine',0.08);tone(240,0.15,'sine',0.05);tone(120,0.25,'triangle',0.04);}
function sfxWall(){tone(500,0.03,'sine',0.04);}
function sfxPaddle(){tone(700,0.05,'triangle',0.06);tone(1050,0.03,'sine',0.03);}
function sfxLose(){tone(180,0.35,'sawtooth',0.08);tone(120,0.45,'sine',0.05);}

// BGM 128bpm电子节拍
let bgmOn=false,bgmTmr=null;
function bgmStart(){
  if(bgmOn)return;bgmOn=true;
  const bpm=128,step=60/bpm/2*1000;
  let t=0;
  const bass=[55,55,65.41,73.42, 55,55,82.41,73.42];
  const arp=[220,261.63,329.63,261.63, 220,196,174.61,196];
  function tick(){
    if(!bgmOn)return;
    const s=t%16;
    if(s%4===0)tone(50,0.1,'sine',0.1);
    if(s%2===0)noise(0.03,0.03,3000);
    if(s===0||s===8)tone(bass[Math.floor(t/16)%bass.length],0.35,'sine',0.05);
    if(s%2===0)tone(arp[s%arp.length],0.12,'triangle',0.02);
    if(s===4||s===12){noise(0.06,0.04,1500);tone(180,0.05,'triangle',0.02);}
    t++;
  }
  bgmTmr=setInterval(tick,step);
}
function bgmStop(){bgmOn=false;if(bgmTmr){clearInterval(bgmTmr);bgmTmr=null;}}

// ===== 粒子 =====
let particles=[],rings=[];
function emitP(x,y,c,n=8,spd=3){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:1,dec:0.015+Math.random()*0.02,sz:1.5+Math.random()*3,c});
  }
}
function emitRing(x,y,c,r=60){
  rings.push({x,y,c,r,life:1,maxR:r});
}
function updPart(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=p.dec;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.life-=0.04;
    if(r.life<=0)rings.splice(i,1);
  }
}
function drawPart(){
  for(const p of particles){
    ctx.globalAlpha=p.life*0.8;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ctx.fill();
  }
  for(const r of rings){
    ctx.globalAlpha=r.life*0.4;ctx.strokeStyle=r.c;ctx.lineWidth=2*r.life;
    ctx.beginPath();ctx.arc(r.x,r.y,r.maxR*(1-r.life*0.3),0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ===== 球拖尾 =====
let trail=[];
function updTrail(){
  if(gameState==='playing'){
    trail.push({x:ball.x,y:ball.y,life:1});
  }
  for(let i=trail.length-1;i>=0;i--){
    trail[i].life-=0.06;
    if(trail[i].life<=0)trail.splice(i,1);
  }
}
function drawTrail(){
  for(const t of trail){
    ctx.globalAlpha=t.life*0.3;
    ctx.fillStyle=C.ballGlow;
    ctx.beginPath();ctx.arc(t.x,t.y,ball.r*t.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===== 游戏对象 =====
let paddle,ball,bricks,score,lives,combo,gameState,startTime,spdMul;
const ROWS=8,COLS=9,BW=48,BH=18,BG=4;
const BOX=(W-COLS*(BW+BG)+BG)/2;
const BOY=52;

function makeBricks(){
  bricks=[];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let type='normal';
      const rn=Math.random();
      // 上层更容易出现硬质和爆炸
      const hardChance=r<3?0.25:0.18;
      const explChance=r<2?0.15:0.1;
      if(rn<explChance)type='explosive';
      else if(rn<explChance+hardChance)type='hard';
      bricks.push({
        x:BOX+c*(BW+BG),y:BOY+r*(BH+BG),w:BW,h:BH,
        type,hits:type==='hard'?2:1,maxHits:type==='hard'?2:1,alive:true,row:r
      });
    }
  }
}

function resetBall(){
  ball={x:W/2,y:H-70,r:6,dx:2.5*(Math.random()>0.5?1:-1),dy:-3.5,base:4};
  spdMul=1;trail=[];
}

function initGame(){
  paddle={x:W/2-45,y:H-36,w:90,h:10};
  resetBall();makeBricks();
  score=0;lives=3;combo=0;particles=[];rings=[];trail=[];
  startTime=Date.now();updHUD();
}

function updHUD(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('livesVal').textContent=lives;
  document.getElementById('comboVal').textContent=combo;
  document.getElementById('speedFill').style.width=Math.min((spdMul-1)/1.2*100,100)+'%';
}

// ===== 爆炸连锁 =====
let shake=0;
const explored=new Set();
function explode(b,id){
  if(explored.has(id))return;
  explored.add(id);
  const cx=b.x+b.w/2,cy=b.y+b.h/2,rad=75;
  emitP(cx,cy,C.explosive[1],18,4);
  emitP(cx,cy,'#ffd060',10,3);
  emitRing(cx,cy,C.explosive[1],rad);
  shake=10;
  for(const o of bricks){
    if(!o.alive||o===b)continue;
    const d=Math.hypot(o.x+o.w/2-cx,o.y+o.h/2-cy);
    if(d<rad){
      o.hits--;
      if(o.hits<=0){
        o.alive=false;
        score+=o.type==='explosive'?30:o.type==='hard'?20:10;
        emitP(o.x+o.w/2,o.y+o.h/2,
          o.type==='explosive'?C.explosive[1]:o.type==='hard'?C.hard[1]:C.normal[o.row%3][1],5);
        if(o.type==='explosive')explode(o,bricks.indexOf(o));
      }
    }
  }
}

// ===== 碰撞 =====
function hitBricks(){
  for(const b of bricks){
    if(!b.alive)continue;
    const cx=Math.max(b.x,Math.min(ball.x,b.x+b.w));
    const cy=Math.max(b.y,Math.min(ball.y,b.y+b.h));
    const dx=ball.x-cx,dy=ball.y-cy;
    if(dx*dx+dy*dy<ball.r*ball.r){
      const ox=ball.r-Math.abs(ball.x-(b.x+b.w/2))+b.w/2;
      const oy=ball.r-Math.abs(ball.y-(b.y+b.h/2))+b.h/2;
      if(ox<oy)ball.dx=-ball.dx;else ball.dy=-ball.dy;

      b.hits--;combo++;
      if(b.hits<=0){
        b.alive=false;explored.clear();
        if(b.type==='normal'){
          score+=10*(1+Math.floor(combo/5));
          sfxNormal();
          emitP(b.x+b.w/2,b.y+b.h/2,C.normal[b.row%3][1],6);
        }else if(b.type==='hard'){
          score+=20*(1+Math.floor(combo/5));
          sfxHard();
          emitP(b.x+b.w/2,b.y+b.h/2,C.hard[1],8);
        }else{
          score+=30*(1+Math.floor(combo/5));
          sfxExplode();
          explode(b,bricks.indexOf(b));
        }
      }else{
        sfxHard();
        emitP(b.x+b.w/2,b.y+b.h/2,C.hardHit[0],4);
      }
      updHUD();return;
    }
  }
  combo=0;
}

// ===== 绘制 =====
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,C.bg1);g.addColorStop(1,C.bg2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(46,107,138,0.03)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawPaddle(){
  ctx.shadowColor=C.paddleGlow;ctx.shadowBlur=16;
  ctx.fillStyle=C.paddle;
  rr(paddle.x,paddle.y,paddle.w,paddle.h,5);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.1)';
  rr(paddle.x+3,paddle.y+1,paddle.w-6,paddle.h*0.4,2);ctx.fill();
}

function drawBall(){
  drawTrail();
  ctx.shadowColor=C.ballGlow;ctx.shadowBlur=12;
  ctx.fillStyle=C.ball;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.beginPath();ctx.arc(ball.x-1.5,ball.y-1.5,1.5,0,Math.PI*2);ctx.fill();
}

function drawBricks(){
  for(const b of bricks){
    if(!b.alive)continue;
    let col;
    if(b.type==='normal') col=C.normal[b.row%3];
    else if(b.type==='hard') col=b.hits<b.maxHits?C.hardHit:C.hard;
    else col=C.explosive;

    ctx.fillStyle=col[1];
    rr(b.x,b.y,b.w,b.h,3);ctx.fill();

    // 顶部高光
    ctx.fillStyle='rgba(255,255,255,0.06)';
    rr(b.x+1,b.y+1,b.w-2,b.h*0.35,2);ctx.fill();

    // 硬砖块裂纹
    if(b.type==='hard'&&b.hits<b.maxHits){
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(b.x+b.w*0.25,b.y);ctx.lineTo(b.x+b.w*0.45,b.y+b.h*0.55);
      ctx.lineTo(b.x+b.w*0.35,b.y+b.h);
      ctx.moveTo(b.x+b.w*0.45,b.y+b.h*0.55);ctx.lineTo(b.x+b.w*0.7,b.y+b.h*0.3);
      ctx.stroke();
    }

    // 爆炸砖块星标
    if(b.type==='explosive'){
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.font='bold 10px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✦',b.x+b.w/2,b.y+b.h/2+0.5);
      // 脉冲边框
      const pulse=0.5+0.5*Math.sin(Date.now()/300);
      ctx.strokeStyle=`rgba(255,80,100,${0.15+pulse*0.15})`;
      ctx.lineWidth=1;
      rr(b.x-0.5,b.y-0.5,b.w+1,b.h+1,3.5);ctx.stroke();
    }
  }
}

// ===== 输入 =====
let mouseX=W/2;
cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=cvs.getBoundingClientRect();
  mouseX=(e.touches[0].clientX-r.left)*(W/r.width);
},{passive:false});

// 键盘
let keyL=false,keyR=false;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')keyL=true;
  if(e.key==='ArrowRight')keyR=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')keyL=false;
  if(e.key==='ArrowRight')keyR=false;
});

// ===== 主循环 =====
function update(){
  if(gameState!=='playing')return;

  // 球速
  const el=(Date.now()-startTime)/1000;
  spdMul=1+el/75;if(spdMul>2.2)spdMul=2.2;
  updHUD();

  // 键盘控制
  if(keyL)mouseX-=7;
  if(keyR)mouseX+=7;
  mouseX=Math.max(paddle.w/2,Math.min(W-paddle.w/2,mouseX));

  // 挡板
  paddle.x+=(mouseX-paddle.w/2-paddle.x)*0.18;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  // 球
  const spd=ball.base*spdMul;
  const mag=Math.hypot(ball.dx,ball.dy);
  ball.x+=ball.dx/mag*spd;
  ball.y+=ball.dy/mag*spd;

  // 墙
  if(ball.x-ball.r<0){ball.x=ball.r;ball.dx=Math.abs(ball.dx);sfxWall();}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.dx=-Math.abs(ball.dx);sfxWall();}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.dy=Math.abs(ball.dy);sfxWall();}

  // 挡板
  if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h
    &&ball.x>=paddle.x-2&&ball.x<=paddle.x+paddle.w+2){
    ball.dy=-Math.abs(ball.dy);
    const hp=(ball.x-paddle.x)/paddle.w;
    ball.dx=(hp-0.5)*6;
    ball.y=paddle.y-ball.r;
    sfxPaddle();
    emitP(ball.x,ball.y,C.paddleHi,3,2);
  }

  hitBricks();

  // 掉落
  if(ball.y-ball.r>H){
    lives--;sfxLose();updHUD();
    if(lives<=0){
      gameState='over';bgmStop();
      document.getElementById('finalScore').textContent='得分: '+score;
      showUI('overScreen');
    }else resetBall();
  }

  // 胜利
  if(bricks.every(b=>!b.alive)){
    gameState='win';bgmStop();
    document.getElementById('winScore').textContent='得分: '+score;
    showUI('winScreen');
  }

  updPart();updTrail();
  if(shake>0)shake--;
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*0.8,(Math.random()-0.5)*shake*0.8);
  drawBG();drawBricks();drawPaddle();
  if(gameState==='playing')drawBall();
  drawPart();ctx.restore();
}

function loop(){update();render();requestAnimationFrame(loop);}

// ===== UI =====
function showUI(id){
  document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));
  if(id)document.getElementById(id).classList.add('show');
  document.getElementById('ui').classList.toggle('active',!!id);
}

function startGame(){
  ea();initGame();gameState='playing';
  showUI(null);bgmStart();
}

initGame();gameState='start';render();loop();
</script>
</body>
</html>
