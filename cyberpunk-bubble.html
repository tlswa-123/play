<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>NEON POP // 赛博泡泡龙</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#05010a;
    overflow:hidden;
    font-family: 'Courier New', monospace;
    color:#fff;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 50%, #15052a 0%, #05010a 70%),
      #05010a;
  }
  #wrap {
    position:relative;
    width: 480px;
    height: 720px;
    border: 2px solid #ff00ff;
    border-radius: 8px;
    box-shadow:
      0 0 20px #ff00ff,
      0 0 40px rgba(0, 230, 255, .35),
      inset 0 0 30px rgba(255, 0, 255, .15);
    background:
      linear-gradient(180deg, rgba(255,0,255,0.04), rgba(0,230,255,0.04)),
      #05010a;
    overflow:hidden;
  }
  canvas { display:block; width:100%; height:100%; }

  #hud {
    position:absolute; top:10px; left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
    z-index:5;
    text-shadow: 0 0 8px currentColor;
    font-size:14px; letter-spacing:2px;
  }
  #score { color:#39ff14; }
  #level { color:#00e6ff; }
  #title {
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center; font-size:11px; letter-spacing:4px;
    color:#ff00ff; text-shadow:0 0 8px #ff00ff;
    pointer-events:none;
  }

  #overlay {
    position:absolute; inset:0;
    background: rgba(5,1,10,0.85);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:10; gap:18px;
    backdrop-filter: blur(2px);
  }
  #overlay h1 {
    font-size:42px; letter-spacing:8px;
    color:#ff00ff;
    text-shadow:
      0 0 10px #ff00ff,
      0 0 25px #ff00ff,
      0 0 45px #ff00ff;
    animation: flicker 2.5s infinite;
  }
  #overlay h2 {
    font-size:18px; letter-spacing:4px; color:#00e6ff;
    text-shadow:0 0 10px #00e6ff;
  }
  #overlay p {
    font-size:12px; letter-spacing:2px; color:#aaa;
    text-align:center; line-height:1.8;
  }
  #overlay button {
    margin-top:10px;
    padding:12px 30px;
    background:transparent;
    border:2px solid #39ff14;
    color:#39ff14;
    font-family:inherit;
    font-size:14px; letter-spacing:4px;
    cursor:pointer;
    text-shadow:0 0 8px #39ff14;
    box-shadow:0 0 12px #39ff14, inset 0 0 12px rgba(57,255,20,.2);
    transition: all .2s;
  }
  #overlay button:hover {
    background:#39ff14; color:#05010a;
    box-shadow:0 0 25px #39ff14;
  }
  @keyframes flicker {
    0%, 100% { opacity:1; }
    45% { opacity:1; }
    47% { opacity:.6; }
    49% { opacity:1; }
    70% { opacity:.85; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="score">SCORE 0</div>
    <div id="level">LV 01</div>
  </div>
  <div id="title">// NEON POP — CYBER BUBBLE //</div>

  <div id="overlay">
    <h1>NEON POP</h1>
    <h2>CYBER BUBBLE</h2>
    <p>
      移动鼠标 / 手指 → 瞄准<br>
      点击 / 触摸 → 发射霓虹泡泡<br>
      三连同色 → 触发光圈爆炸<br>
      让泡泡触底 → SYSTEM CRASH
    </p>
    <button id="startBtn">START</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 720;
  canvas.width = W; canvas.height = H;

  // ---- Color palette (cyberpunk neon) ----
  const COLORS = [
    { name:'magenta', core:'#ff2bd6', glow:'#ff00ff' },
    { name:'cyan',    core:'#3df0ff', glow:'#00e6ff' },
    { name:'green',   core:'#7dff5b', glow:'#39ff14' },
    { name:'orange',  core:'#ffae3d', glow:'#ff8800' },
    { name:'violet',  core:'#b66bff', glow:'#9d00ff' },
  ];

  // ---- Grid config (hex grid) ----
  const R = 18;                       // bubble radius
  const COLS = 12;
  const ROW_H = R * Math.sqrt(3);     // hex row height
  const TOP_OFF = 40;
  const DEATH_LINE = H - 110;

  // grid[row][col] = colorIndex or null
  let grid = [];
  let rows = 18;

  // shooter
  const shooter = {
    x: W/2, y: H - 60,
    angle: -Math.PI/2,
    next: 0, current: 0,
  };

  let bullet = null;        // flying bubble
  let particles = [];       // explosion particles
  let popping = [];         // popping bubbles animation
  let falling = [];         // detached bubbles
  let shake = 0;

  let score = 0;
  let level = 1;
  let running = false;
  let gameOver = false;
  let win = false;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  // ---- Helpers ----
  function rowOffset(row) {
    // even row offset 0, odd row offset R
    return (row % 2 === 0) ? R + 4 : R*2 + 4;
  }
  function gridToPixel(row, col) {
    const x = rowOffset(row) + col * (R*2);
    const y = TOP_OFF + row * ROW_H;
    return { x, y };
  }
  function pixelToGrid(x, y) {
    const row = Math.round((y - TOP_OFF) / ROW_H);
    const offset = rowOffset(row);
    const col = Math.round((x - offset) / (R*2));
    return { row, col };
  }
  function inBounds(row, col) {
    if (row < 0 || row >= grid.length) return false;
    const maxCol = (row % 2 === 0) ? COLS : COLS - 1;
    if (col < 0 || col >= maxCol) return false;
    return true;
  }
  function neighbors(row, col) {
    const even = row % 2 === 0;
    const list = even ? [
      [row,   col-1], [row,   col+1],
      [row-1, col-1], [row-1, col],
      [row+1, col-1], [row+1, col],
    ] : [
      [row,   col-1], [row,   col+1],
      [row-1, col],   [row-1, col+1],
      [row+1, col],   [row+1, col+1],
    ];
    return list.filter(([r,c]) => inBounds(r,c));
  }

  // ---- Init level ----
  function initLevel(lv) {
    grid = [];
    const filledRows = Math.min(6 + Math.floor(lv/2), 10);
    const colorCount = Math.min(3 + Math.floor(lv/2), COLORS.length);
    for (let r = 0; r < filledRows; r++) {
      const row = [];
      const maxCol = (r % 2 === 0) ? COLS : COLS - 1;
      for (let c = 0; c < maxCol; c++) {
        row.push(Math.floor(Math.random() * colorCount));
      }
      grid.push(row);
    }
    shooter.current = randomBubbleColor();
    shooter.next = randomBubbleColor();
    bullet = null;
    particles = [];
    popping = [];
    falling = [];
    score = 0;
    gameOver = false;
    win = false;
    updateHUD();
  }

  function randomBubbleColor() {
    // Only choose colors currently on board to keep it fair
    const used = new Set();
    grid.forEach(row => row.forEach(c => { if (c !== null) used.add(c); }));
    const arr = [...used];
    if (!arr.length) return Math.floor(Math.random() * COLORS.length);
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function updateHUD() {
    scoreEl.textContent = 'SCORE ' + score.toString().padStart(5,'0');
    levelEl.textContent = 'LV ' + level.toString().padStart(2,'0');
  }

  // ---- Drawing bubble with neon glow + glossy reflection ----
  function drawBubble(x, y, colorIdx, alpha = 1, scale = 1) {
    const c = COLORS[colorIdx];
    const r = R * scale;

    ctx.save();
    ctx.globalAlpha = alpha;

    // outer glow
    const glow = ctx.createRadialGradient(x, y, r*0.6, x, y, r*2.2);
    glow.addColorStop(0, c.glow + 'cc');
    glow.addColorStop(0.5, c.glow + '44');
    glow.addColorStop(1, c.glow + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r*2.2, 0, Math.PI*2);
    ctx.fill();

    // body (translucent)
    const body = ctx.createRadialGradient(x - r*0.35, y - r*0.4, r*0.1, x, y, r);
    body.addColorStop(0, '#ffffff');
    body.addColorStop(0.25, c.core);
    body.addColorStop(1, c.glow);
    ctx.fillStyle = body;
    ctx.globalAlpha = alpha * 0.75;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();

    // rim light
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = c.glow;
    ctx.lineWidth = 1.4;
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(x, y, r-0.5, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // glossy highlight
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(x - r*0.35, y - r*0.45, r*0.32, r*0.18, -0.4, 0, Math.PI*2);
    ctx.fill();
    // small spark
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(x + r*0.3, y - r*0.1, r*0.08, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  // ---- Background grid ----
  function drawBackground() {
    ctx.save();
    // dark base
    ctx.fillStyle = '#05010a';
    ctx.fillRect(0,0,W,H);

    // perspective grid lines
    ctx.strokeStyle = 'rgba(255, 0, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 20; i++) {
      ctx.beginPath();
      ctx.moveTo((W/20)*i, 0);
      ctx.lineTo((W/20)*i, H);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0, 230, 255, 0.07)';
    for (let i = 0; i <= 28; i++) {
      ctx.beginPath();
      ctx.moveTo(0, (H/28)*i);
      ctx.lineTo(W, (H/28)*i);
      ctx.stroke();
    }

    // top neon bar
    const grad = ctx.createLinearGradient(0, 0, 0, 30);
    grad.addColorStop(0, 'rgba(255,0,255,0.5)');
    grad.addColorStop(1, 'rgba(255,0,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, 30);

    // death line
    ctx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ff2244';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, DEATH_LINE);
    ctx.lineTo(W, DEATH_LINE);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // ---- Shooter ----
  function drawShooter() {
    ctx.save();
    // base platform
    ctx.translate(shooter.x, shooter.y);
    ctx.shadowColor = '#00e6ff';
    ctx.shadowBlur = 14;
    ctx.strokeStyle = '#00e6ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, R*1.6, 0, Math.PI*2);
    ctx.stroke();

    // inner ring
    ctx.shadowColor = '#ff00ff';
    ctx.strokeStyle = '#ff00ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, R*1.15, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // cannon
    ctx.rotate(shooter.angle + Math.PI/2);
    ctx.fillStyle = 'rgba(0, 230, 255, .15)';
    ctx.strokeStyle = '#00e6ff';
    ctx.shadowColor = '#00e6ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-4, -28);
    ctx.lineTo(4, -28);
    ctx.lineTo(6, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    // current bubble in cannon
    drawBubble(shooter.x, shooter.y, shooter.current, 1, 1);

    // next bubble preview
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('NEXT', shooter.x + 70, shooter.y + 4);
    ctx.restore();
    drawBubble(shooter.x + 70, shooter.y + 22, shooter.next, 1, 0.7);

    // aim line
    if (!bullet && !gameOver) drawAimLine();
  }

  function drawAimLine() {
    let x = shooter.x, y = shooter.y;
    const dx = Math.cos(shooter.angle);
    const dy = Math.sin(shooter.angle);
    let vx = dx, vy = dy;
    ctx.save();
    ctx.strokeStyle = COLORS[shooter.current].glow + 'aa';
    ctx.shadowColor = COLORS[shooter.current].glow;
    ctx.shadowBlur = 8;
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    let steps = 0;
    while (steps < 200 && y > 30) {
      x += vx * 6;
      y += vy * 6;
      if (x < R) { x = R; vx = -vx; }
      if (x > W - R) { x = W - R; vx = -vx; }
      ctx.lineTo(x, y);
      // stop on hit
      const hit = checkBulletHit(x, y, true);
      if (hit) break;
      steps++;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ---- Grid collision check ----
  function checkBulletHit(x, y, dryRun=false) {
    if (y - R <= TOP_OFF - ROW_H/2) return { row: 0, col: 0, snap:true };
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        if (grid[r][c] === null) continue;
        const p = gridToPixel(r, c);
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < R*1.85) return { row:r, col:c, hitPos:p };
      }
    }
    return null;
  }

  // ---- Snap bullet to grid ----
  function snapBullet() {
    let { row, col } = pixelToGrid(bullet.x, bullet.y);
    if (row < 0) row = 0;
    while (grid.length <= row) {
      const maxCol = (grid.length % 2 === 0) ? COLS : COLS - 1;
      grid.push(new Array(maxCol).fill(null));
    }
    const maxCol = (row % 2 === 0) ? COLS : COLS - 1;
    if (col < 0) col = 0;
    if (col >= maxCol) col = maxCol - 1;
    // if occupied, find nearest empty neighbor
    if (grid[row][col] !== null) {
      const ns = neighbors(row, col).filter(([r,c]) => grid[r][c] === null);
      if (ns.length) {
        const p = { x: bullet.x, y: bullet.y };
        ns.sort((a,b) => {
          const pa = gridToPixel(a[0],a[1]);
          const pb = gridToPixel(b[0],b[1]);
          return Math.hypot(pa.x-p.x,pa.y-p.y) - Math.hypot(pb.x-p.x,pb.y-p.y);
        });
        [row, col] = ns[0];
      }
    }
    grid[row][col] = bullet.color;
    const placedColor = bullet.color;
    bullet = null;

    // check matches
    const matches = floodMatch(row, col, placedColor);
    if (matches.length >= 3) {
      explodeMatches(matches);
      // detach floating
      const detached = findFloating();
      detachAll(detached);
      score += matches.length * 30 + detached.length * 50;
      shake = 8;
    } else {
      // no match, check death line
      const p = gridToPixel(row, col);
      if (p.y + R >= DEATH_LINE) {
        gameOver = true;
        showOverlay('SYSTEM CRASH', 'GAME OVER', '得分 ' + score, 'RETRY');
      }
    }
    updateHUD();

    // clear empty trailing rows
    while (grid.length && grid[grid.length-1].every(c => c === null)) grid.pop();
    if (grid.every(row => row.every(c => c === null))) {
      win = true;
      level++;
      showOverlay('LEVEL CLEAR', 'LV ' + (level).toString().padStart(2,'0'), '得分 ' + score, 'NEXT');
    }

    // load next bullet
    shooter.current = shooter.next;
    shooter.next = randomBubbleColor();
  }

  function floodMatch(row, col, color) {
    const visited = new Set();
    const queue = [[row, col]];
    const result = [];
    while (queue.length) {
      const [r,c] = queue.shift();
      const key = r+','+c;
      if (visited.has(key)) continue;
      visited.add(key);
      if (!inBounds(r,c)) continue;
      if (grid[r][c] !== color) continue;
      result.push([r,c]);
      neighbors(r,c).forEach(n => queue.push(n));
    }
    return result;
  }

  function explodeMatches(list) {
    list.forEach(([r,c]) => {
      const p = gridToPixel(r,c);
      const color = grid[r][c];
      grid[r][c] = null;
      popping.push({ x:p.x, y:p.y, color, t:0, life:30 });
      spawnExplosion(p.x, p.y, color);
    });
  }

  function findFloating() {
    // any bubble not connected to top row
    const visited = new Set();
    const queue = [];
    if (grid[0]) {
      for (let c = 0; c < grid[0].length; c++) {
        if (grid[0][c] !== null) queue.push([0, c]);
      }
    }
    while (queue.length) {
      const [r,c] = queue.shift();
      const key = r+','+c;
      if (visited.has(key)) continue;
      visited.add(key);
      neighbors(r,c).forEach(([nr,nc]) => {
        if (grid[nr][nc] !== null) queue.push([nr,nc]);
      });
    }
    const detached = [];
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        if (grid[r][c] !== null && !visited.has(r+','+c)) {
          detached.push([r,c]);
        }
      }
    }
    return detached;
  }

  function detachAll(list) {
    list.forEach(([r,c]) => {
      const p = gridToPixel(r,c);
      falling.push({
        x:p.x, y:p.y, vx:(Math.random()-0.5)*2, vy:0, color:grid[r][c],
      });
      grid[r][c] = null;
    });
  }

  // ---- Particles / explosion ring ----
  function spawnExplosion(x, y, colorIdx) {
    // burst particles
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      particles.push({
        type:'spark',
        x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        color: colorIdx, t:0, life: 30 + Math.random()*15,
      });
    }
    // shock ring
    particles.push({ type:'ring', x, y, r:R*0.6, color:colorIdx, t:0, life:25 });
    particles.push({ type:'ring', x, y, r:R*0.3, color:colorIdx, t:0, life:35, delay:6 });
  }

  function updateParticles() {
    particles = particles.filter(p => {
      p.t++;
      if (p.delay && p.t < p.delay) return true;
      if (p.type === 'spark') {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.05;
        p.vx *= 0.97; p.vy *= 0.97;
      } else if (p.type === 'ring') {
        p.r += 2.4;
      }
      return p.t < p.life;
    });
    popping = popping.filter(b => { b.t++; return b.t < b.life; });
    falling = falling.filter(b => {
      b.vy += 0.4; b.y += b.vy; b.x += b.vx;
      return b.y < H + 30;
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      const c = COLORS[p.color];
      if (p.delay && p.t < p.delay) return;
      const t = p.t - (p.delay||0);
      const lifeLeft = (p.life - p.t) / p.life;
      ctx.save();
      if (p.type === 'spark') {
        ctx.globalAlpha = lifeLeft;
        ctx.shadowColor = c.glow;
        ctx.shadowBlur = 10;
        ctx.fillStyle = c.core;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2 + lifeLeft*1.5, 0, Math.PI*2);
        ctx.fill();
      } else if (p.type === 'ring') {
        ctx.globalAlpha = lifeLeft;
        ctx.strokeStyle = c.glow;
        ctx.shadowColor = c.glow;
        ctx.shadowBlur = 18;
        ctx.lineWidth = 2 + lifeLeft*2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    });

    popping.forEach(b => {
      const k = b.t / b.life;
      drawBubble(b.x, b.y, b.color, 1 - k, 1 + k*1.2);
    });

    falling.forEach(b => drawBubble(b.x, b.y, b.color, 1, 1));
  }

  // ---- Bullet update ----
  function updateBullet() {
    if (!bullet) return;
    bullet.x += bullet.vx;
    bullet.y += bullet.vy;
    if (bullet.x < R) { bullet.x = R; bullet.vx = -bullet.vx; }
    if (bullet.x > W - R) { bullet.x = W - R; bullet.vx = -bullet.vx; }

    if (bullet.y - R <= TOP_OFF - ROW_H/2) {
      snapBullet();
      return;
    }
    const hit = checkBulletHit(bullet.x, bullet.y);
    if (hit) snapBullet();
  }

  // ---- Render grid bubbles ----
  function drawGrid() {
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        if (grid[r][c] === null) continue;
        const p = gridToPixel(r, c);
        drawBubble(p.x, p.y, grid[r][c]);
      }
    }
  }

  // ---- Main loop ----
  function loop() {
    requestAnimationFrame(loop);
    if (!running) return;

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      shake *= 0.85;
      if (shake < 0.3) shake = 0;
    }

    drawBackground();
    drawGrid();
    if (bullet) drawBubble(bullet.x, bullet.y, bullet.color);
    drawParticles();
    drawShooter();

    ctx.restore();

    updateBullet();
    updateParticles();
  }
  loop();

  // ---- Input ----
  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (cx - rect.left) * (W / rect.width),
      y: (cy - rect.top) * (H / rect.height),
    };
  }
  function updateAim(e) {
    const p = pointerPos(e);
    const dx = p.x - shooter.x;
    const dy = p.y - shooter.y;
    let a = Math.atan2(dy, dx);
    // clamp
    const min = -Math.PI + 0.2;
    const max = -0.2;
    if (a > max) a = max;
    if (a < min) a = min;
    shooter.angle = a;
  }
  canvas.addEventListener('mousemove', updateAim);
  canvas.addEventListener('touchmove', e => { e.preventDefault(); updateAim(e); }, { passive:false });

  function fire() {
    if (bullet || !running || gameOver) return;
    const speed = 11;
    bullet = {
      x: shooter.x, y: shooter.y,
      vx: Math.cos(shooter.angle) * speed,
      vy: Math.sin(shooter.angle) * speed,
      color: shooter.current,
    };
  }
  canvas.addEventListener('mousedown', fire);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); updateAim(e); fire(); }, { passive:false });

  // ---- Overlay ----
  function showOverlay(title, sub, info, btnText) {
    overlay.innerHTML = `
      <h1>${title}</h1>
      <h2>${sub}</h2>
      <p>${info}</p>
      <button id="startBtn">${btnText}</button>
    `;
    overlay.style.display = 'flex';
    running = false;
    document.getElementById('startBtn').addEventListener('click', () => {
      overlay.style.display = 'none';
      if (win) { win = false; initLevel(level); }
      else if (gameOver) { level = 1; initLevel(level); }
      else { initLevel(level); }
      running = true;
    });
  }

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    initLevel(level);
    running = true;
  });
})();
</script>
</body>
</html>
