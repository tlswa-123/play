<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>宝石三消大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 40%, #0f1a3e 100%);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Segoe UI', sans-serif;
    overflow: hidden; user-select: none;
  }
  #game-container {
    position: relative; display: flex; flex-direction: column;
    align-items: center; gap: 12px; padding: 16px;
  }
  #top-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 460px; padding: 10px 20px;
    background: rgba(255,255,255,0.06); border-radius: 16px;
    backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1);
  }
  .info-block { text-align: center; color: #fff; }
  .info-label { font-size: 11px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1.5px; }
  .info-value { font-size: 28px; font-weight: 800; }
  #score-val { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.4); }
  #combo-val { color: #ff6bff; transition: transform 0.2s; text-shadow: 0 0 12px rgba(255,107,255,0.4); }
  #combo-val.pop { transform: scale(1.5); }
  #timer-val { color: #6bffff; transition: color 0.3s; text-shadow: 0 0 12px rgba(107,255,255,0.4); }
  #timer-val.warning { color: #ff4444; animation: pulse 0.5s infinite; text-shadow: 0 0 16px rgba(255,68,68,0.6); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.2); }
  }
  #combo-multiplier {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    font-size: 32px; font-weight: 900; color: #ff6bff;
    text-shadow: 0 0 24px rgba(255,107,255,0.7), 0 0 48px rgba(255,107,255,0.3);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 10;
  }
  #combo-multiplier.show { opacity: 1; transform: translateX(-50%) scale(1.2); }
  #game-canvas {
    border-radius: 16px; cursor: pointer;
    box-shadow: 0 0 40px rgba(100,50,200,0.2), 0 8px 32px rgba(0,0,0,0.5);
  }
  #tools-bar {
    display: flex; gap: 12px; justify-content: center;
    width: 100%; max-width: 460px;
  }
  .tool-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 12px 8px; border: none; border-radius: 14px;
    background: rgba(255,255,255,0.06); color: #fff;
    cursor: pointer; transition: all 0.2s; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
  }
  .tool-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(100,50,200,0.3); }
  .tool-btn:active { transform: scale(0.95); }
  .tool-btn.disabled { opacity: 0.25; pointer-events: none; }
  .tool-btn .tool-icon { font-size: 26px; }
  .tool-btn .tool-count {
    background: linear-gradient(135deg, #9333ea, #6d28d9);
    color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700;
  }
  #game-over {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: none;
    flex-direction: column; justify-content: center; align-items: center;
    gap: 16px; z-index: 20; border-radius: 16px;
    backdrop-filter: blur(10px);
  }
  #game-over.show { display: flex; }
  #game-over h2 { color: #ffd700; font-size: 36px; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
  #game-over .final-score { color: #fff; font-size: 52px; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
  #restart-btn {
    padding: 14px 44px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #9333ea, #6d28d9);
    color: #fff; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(147,51,234,0.4);
  }
  #restart-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(147,51,234,0.6); }
  .score-popup {
    position: absolute; pointer-events: none; font-weight: 900;
    color: #ffd700; text-shadow: 0 0 16px rgba(255,215,0,0.6), 0 2px 8px rgba(0,0,0,0.5);
    animation: floatUp 0.8s ease-out forwards; z-index: 15;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="top-bar">
    <div class="info-block">
      <div class="info-label">分数</div>
      <div class="info-value" id="score-val">0</div>
    </div>
    <div class="info-block">
      <div class="info-label">连击</div>
      <div class="info-value" id="combo-val">0</div>
    </div>
    <div class="info-block">
      <div class="info-label">时间</div>
      <div class="info-value" id="timer-val">60</div>
    </div>
  </div>
  <div id="combo-multiplier"></div>
  <canvas id="game-canvas"></canvas>
  <div id="tools-bar">
    <button class="tool-btn" id="tool-hammer" onclick="useTool('hammer')">
      <span class="tool-icon">⛏️</span>
      <span>锤子</span>
      <span class="tool-count" id="hammer-count">3</span>
    </button>
    <button class="tool-btn" id="tool-shuffle" onclick="useTool('shuffle')">
      <span class="tool-icon">🔄</span>
      <span>刷新</span>
      <span class="tool-count" id="shuffle-count">2</span>
    </button>
    <button class="tool-btn" id="tool-time" onclick="useTool('time')">
      <span class="tool-icon">⏰</span>
      <span>时间+15</span>
      <span class="tool-count" id="time-count">1</span>
    </button>
  </div>
  <div id="game-over">
    <h2>💎 时间到！</h2>
    <div class="final-score" id="final-score">0</div>
    <button id="restart-btn" onclick="restartGame()">再来一局</button>
  </div>
</div>

<script>
// ============ 常量 ============
const COLS = 8, ROWS = 8;
// 6种宝石: 红宝石(圆形)、黄玉(椭圆)、黄水晶(水滴)、紫水晶(八角)、碧玺(心形)、蓝宝石(菱形)
const GEM_COUNT = 6;
const GEM_NAMES = ['红宝石','黄玉','黄水晶','紫水晶','碧玺','蓝宝石'];
// 主色、亮色（高光）、暗色（阴影）、折射色
const GEM_COLORS = [
  { main:'#e02040', light:'#ff6080', dark:'#a01030', refract:'#ff90a0', glow:'rgba(224,32,64,0.5)' },   // 红宝石
  { main:'#e08020', light:'#ffb050', dark:'#a06010', refract:'#ffd080', glow:'rgba(224,128,32,0.5)' },   // 黄玉
  { main:'#d0a010', light:'#f0d040', dark:'#a07008', refract:'#fff070', glow:'rgba(208,160,16,0.5)' },   // 黄水晶
  { main:'#8030c0', light:'#b060f0', dark:'#501890', refract:'#d090ff', glow:'rgba(128,48,192,0.5)' },   // 紫水晶
  { main:'#e05090', light:'#ff80b8', dark:'#a03060', refract:'#ffb0d0', glow:'rgba(224,80,144,0.5)' },   // 碧玺
  { main:'#2060d0', light:'#5090ff', dark:'#103890', refract:'#90c0ff', glow:'rgba(32,96,208,0.5)' },    // 蓝宝石
];

const SPECIAL_BOMB = 'bomb';
const SPECIAL_RAINBOW = 'rainbow';

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let CELL, BOARD_X, BOARD_Y, BOARD_SIZE;
function calcSize() {
  const maxW = Math.min(window.innerWidth - 40, 460);
  const maxH = window.innerHeight - 240;
  const maxBoard = Math.min(maxW, maxH);
  CELL = Math.floor(maxBoard / COLS);
  BOARD_SIZE = CELL * COLS;
  canvas.width = BOARD_SIZE + 8;
  canvas.height = BOARD_SIZE + 8;
  BOARD_X = 4; BOARD_Y = 4;
}
calcSize();

// ============ 游戏状态 ============
let board = [];
let selected = null;
let score = 0;
let combo = 0;
let maxCombo = 0;
let timeLeft = 60;
let gameRunning = false;
let animating = false;
let toolMode = null;
let tools = { hammer: 3, shuffle: 2, time: 1 };
let timerInterval = null;

// 音频
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ============ 音效系统 ============
function playSwapSound() {
  const c = getAudioCtx();
  const osc = c.createOscillator(); const g = c.createGain();
  osc.connect(g); g.connect(c.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(500, c.currentTime);
  osc.frequency.linearRampToValueAtTime(800, c.currentTime + 0.1);
  g.gain.setValueAtTime(0.12, c.currentTime);
  g.gain.linearRampToValueAtTime(0, c.currentTime + 0.12);
  osc.start(c.currentTime); osc.stop(c.currentTime + 0.12);
}

function playMatchSound(comboLevel) {
  const c = getAudioCtx();
  const baseFreq = 600 + comboLevel * 100;
  // 碎裂声
  const noise = c.createBufferSource();
  const buf = c.createBuffer(1, c.sampleRate * 0.12, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(data.length*0.1));
  noise.buffer = buf;
  const ng = c.createGain(); ng.gain.setValueAtTime(0.1, c.currentTime);
  ng.gain.linearRampToValueAtTime(0, c.currentTime + 0.12);
  noise.connect(ng); ng.connect(c.destination); noise.start(c.currentTime);
  // 音调
  const osc = c.createOscillator(); const g = c.createGain();
  osc.connect(g); g.connect(c.destination); osc.type = 'triangle';
  osc.frequency.setValueAtTime(baseFreq, c.currentTime);
  osc.frequency.linearRampToValueAtTime(baseFreq*1.5, c.currentTime + 0.1);
  g.gain.setValueAtTime(0.15, c.currentTime);
  g.gain.linearRampToValueAtTime(0, c.currentTime + 0.18);
  osc.start(c.currentTime); osc.stop(c.currentTime + 0.18);
}

function playComboSound(comboLevel) {
  const c = getAudioCtx();
  const freq = 700 + comboLevel * 140;
  const osc = c.createOscillator(); const g = c.createGain();
  osc.connect(g); g.connect(c.destination); osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, c.currentTime);
  osc.frequency.linearRampToValueAtTime(freq*1.4, c.currentTime + 0.08);
  g.gain.setValueAtTime(0.18, c.currentTime);
  g.gain.linearRampToValueAtTime(0, c.currentTime + 0.12);
  osc.start(c.currentTime); osc.stop(c.currentTime + 0.12);
}

let heartbeatInterval = null;
function startHeartbeat() {
  if (heartbeatInterval) return;
  heartbeatInterval = setInterval(() => {
    if (timeLeft > 10 || !gameRunning) { stopHeartbeat(); return; }
    const c = getAudioCtx();
    [0, 0.15].forEach(offset => {
      const osc = c.createOscillator(); const g = c.createGain();
      osc.connect(g); g.connect(c.destination); osc.type = 'sine';
      osc.frequency.setValueAtTime(offset===0?80:55, c.currentTime+offset);
      g.gain.setValueAtTime(0.22, c.currentTime+offset);
      g.gain.linearRampToValueAtTime(0, c.currentTime+offset+0.12);
      osc.start(c.currentTime+offset); osc.stop(c.currentTime+offset+0.12);
    });
  }, 1000);
}
function stopHeartbeat() { clearInterval(heartbeatInterval); heartbeatInterval = null; }

function playHammerSound() {
  const c = getAudioCtx();
  const osc = c.createOscillator(); const g = c.createGain();
  osc.connect(g); g.connect(c.destination); osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, c.currentTime);
  osc.frequency.linearRampToValueAtTime(50, c.currentTime + 0.15);
  g.gain.setValueAtTime(0.18, c.currentTime);
  g.gain.linearRampToValueAtTime(0, c.currentTime + 0.2);
  osc.start(c.currentTime); osc.stop(c.currentTime + 0.2);
}

function playShuffleSound() {
  const c = getAudioCtx();
  for (let i = 0; i < 6; i++) {
    const osc = c.createOscillator(); const g = c.createGain();
    osc.connect(g); g.connect(c.destination); osc.type = 'sine';
    const t = c.currentTime + i * 0.04;
    osc.frequency.setValueAtTime(400 + Math.random()*500, t);
    g.gain.setValueAtTime(0.07, t);
    g.gain.linearRampToValueAtTime(0, t + 0.06);
    osc.start(t); osc.stop(t + 0.06);
  }
}

function playTimeSound() {
  const c = getAudioCtx();
  [523, 659, 784].forEach((f,i) => {
    const osc = c.createOscillator(); const g = c.createGain();
    osc.connect(g); g.connect(c.destination); osc.type = 'sine';
    const t = c.currentTime + i*0.12;
    osc.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.13, t);
    g.gain.linearRampToValueAtTime(0, t + 0.15);
    osc.start(t); osc.stop(t + 0.15);
  });
}

function playBombSound() {
  const c = getAudioCtx();
  const noise = c.createBufferSource();
  const buf = c.createBuffer(1, c.sampleRate*0.3, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(data.length*0.15));
  noise.buffer = buf;
  const g = c.createGain(); g.gain.setValueAtTime(0.2, c.currentTime);
  g.gain.linearRampToValueAtTime(0, c.currentTime + 0.3);
  noise.connect(g); g.connect(c.destination); noise.start(c.currentTime);
}

function playRainbowSound() {
  const c = getAudioCtx();
  for (let i = 0; i < 8; i++) {
    const osc = c.createOscillator(); const g = c.createGain();
    osc.connect(g); g.connect(c.destination); osc.type = 'sine';
    const t = c.currentTime + i*0.05;
    osc.frequency.setValueAtTime(500 + i*120, t);
    g.gain.setValueAtTime(0.09, t);
    g.gain.linearRampToValueAtTime(0, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  }
}

function playInvalidSwapSound() {
  const c = getAudioCtx();
  const osc = c.createOscillator(); const g = c.createGain();
  osc.connect(g); g.connect(c.destination); osc.type = 'square';
  osc.frequency.setValueAtTime(200, c.currentTime);
  osc.frequency.linearRampToValueAtTime(100, c.currentTime + 0.12);
  g.gain.setValueAtTime(0.08, c.currentTime);
  g.gain.linearRampToValueAtTime(0, c.currentTime + 0.12);
  osc.start(c.currentTime); osc.stop(c.currentTime + 0.12);
}

// ============ 宝石绘制 ============
function drawGem(cx, cy, type, size, alpha) {
  const s = size * 0.42; // 宝石半径
  const colors = GEM_COLORS[type];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;

  // 外发光
  const glowGrad = ctx.createRadialGradient(0, 0, s*0.3, 0, 0, s*1.4);
  glowGrad.addColorStop(0, colors.glow);
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(0, 0, s*1.4, 0, Math.PI*2);
  ctx.fill();

  // 根据类型绘制不同形状
  switch(type) {
    case 0: drawRoundGem(s, colors); break;    // 红宝石 - 圆形
    case 1: drawOvalGem(s, colors); break;      // 黄玉 - 椭圆
    case 2: drawTeardropGem(s, colors); break;  // 黄水晶 - 水滴
    case 3: drawOctagonGem(s, colors); break;   // 紫水晶 - 八角
    case 4: drawHeartGem(s, colors); break;     // 碧玺 - 心形
    case 5: drawDiamondGem(s, colors); break;   // 蓝宝石 - 菱形
  }

  ctx.restore();
}

// 圆形切割宝石
function drawRoundGem(s, c) {
  // 主体渐变
  const grad = ctx.createRadialGradient(-s*0.2, -s*0.2, s*0.1, 0, 0, s);
  grad.addColorStop(0, c.light);
  grad.addColorStop(0.4, c.main);
  grad.addColorStop(0.8, c.dark);
  grad.addColorStop(1, c.dark);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI*2);
  ctx.fill();

  // 内部切面
  ctx.strokeStyle = c.dark;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha *= 0.4;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * s * 0.85, Math.sin(a) * s * 0.85);
    ctx.stroke();
  }
  ctx.globalAlpha /= 0.4;

  // 折射色带
  const refractGrad = ctx.createLinearGradient(-s, -s*0.3, s, s*0.3);
  refractGrad.addColorStop(0, 'transparent');
  refractGrad.addColorStop(0.35, 'transparent');
  refractGrad.addColorStop(0.45, c.refract);
  refractGrad.addColorStop(0.55, c.refract);
  refractGrad.addColorStop(0.65, 'transparent');
  refractGrad.addColorStop(1, 'transparent');
  ctx.globalAlpha *= 0.25;
  ctx.fillStyle = refractGrad;
  ctx.beginPath();
  ctx.arc(0, 0, s*0.9, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha /= 0.25;

  // 高光
  drawHighlight(s * 0.55, -s*0.25, s*0.45, s*0.18);
  drawSpecular(-s*0.2, -s*0.35, s*0.12);
}

// 椭圆切割宝石
function drawOvalGem(s, c) {
  const rx = s * 0.85, ry = s * 1.1;
  const grad = ctx.createRadialGradient(-rx*0.2, -ry*0.25, s*0.1, 0, 0, s*1.1);
  grad.addColorStop(0, c.light);
  grad.addColorStop(0.35, c.main);
  grad.addColorStop(0.75, c.dark);
  grad.addColorStop(1, c.dark);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
  ctx.fill();

  // 椭圆切面线
  ctx.strokeStyle = c.dark;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha *= 0.35;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx*0.5, ry*0.5, 0, 0, Math.PI*2);
  ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const a = (i/4)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*rx*0.5, Math.sin(a)*ry*0.5);
    ctx.lineTo(Math.cos(a)*rx*0.92, Math.sin(a)*ry*0.92);
    ctx.stroke();
  }
  ctx.globalAlpha /= 0.35;

  // 折射
  const refGrad = ctx.createLinearGradient(-rx, -ry*0.2, rx, ry*0.2);
  refGrad.addColorStop(0, 'transparent');
  refGrad.addColorStop(0.3, 'transparent');
  refGrad.addColorStop(0.45, c.refract);
  refGrad.addColorStop(0.55, c.refract);
  refGrad.addColorStop(0.7, 'transparent');
  refGrad.addColorStop(1, 'transparent');
  ctx.globalAlpha *= 0.2;
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx*0.8, ry*0.8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha /= 0.2;

  drawHighlight(rx*0.5, -ry*0.3, rx*0.4, ry*0.16);
  drawSpecular(-rx*0.15, -ry*0.45, s*0.1);
}

// 水滴切割宝石
function drawTeardropGem(s, c) {
  ctx.beginPath();
  ctx.moveTo(0, -s*1.15);
  ctx.bezierCurveTo(s*0.6, -s*0.6, s*0.9, s*0.1, 0, s*0.95);
  ctx.bezierCurveTo(-s*0.9, s*0.1, -s*0.6, -s*0.6, 0, -s*1.15);
  ctx.closePath();
  const grad = ctx.createRadialGradient(-s*0.15, -s*0.2, s*0.1, 0, s*0.1, s*1.2);
  grad.addColorStop(0, c.light);
  grad.addColorStop(0.35, c.main);
  grad.addColorStop(0.75, c.dark);
  grad.addColorStop(1, c.dark);
  ctx.fillStyle = grad;
  ctx.fill();

  // 切面
  ctx.strokeStyle = c.dark; ctx.lineWidth = 0.5;
  ctx.globalAlpha *= 0.35;
  ctx.beginPath();
  ctx.moveTo(0, -s*0.5);
  ctx.lineTo(s*0.45, s*0.3);
  ctx.moveTo(0, -s*0.5);
  ctx.lineTo(-s*0.45, s*0.3);
  ctx.moveTo(0, -s*0.5);
  ctx.lineTo(0, s*0.7);
  ctx.stroke();
  ctx.globalAlpha /= 0.35;

  // 折射
  ctx.globalAlpha *= 0.2;
  const refGrad = ctx.createLinearGradient(-s*0.6, 0, s*0.6, 0);
  refGrad.addColorStop(0, 'transparent');
  refGrad.addColorStop(0.35, c.refract);
  refGrad.addColorStop(0.5, c.refract);
  refGrad.addColorStop(0.65, 'transparent');
  refGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  ctx.moveTo(0, -s*0.8);
  ctx.bezierCurveTo(s*0.4, -s*0.3, s*0.5, s*0.1, 0, s*0.6);
  ctx.bezierCurveTo(-s*0.5, s*0.1, -s*0.4, -s*0.3, 0, -s*0.8);
  ctx.fill();
  ctx.globalAlpha /= 0.2;

  drawHighlight(s*0.15, -s*0.45, s*0.3, s*0.12);
  drawSpecular(-s*0.05, -s*0.7, s*0.09);
}

// 八角切割宝石
function drawOctagonGem(s, c) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i/8)*Math.PI*2 - Math.PI/8;
    const x = Math.cos(a)*s, y = Math.sin(a)*s;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(-s*0.2, -s*0.2, s*0.1, 0, 0, s);
  grad.addColorStop(0, c.light);
  grad.addColorStop(0.35, c.main);
  grad.addColorStop(0.7, c.dark);
  grad.addColorStop(1, c.dark);
  ctx.fillStyle = grad;
  ctx.fill();

  // 切面 - 内八角 + 辐射线
  ctx.strokeStyle = c.dark; ctx.lineWidth = 0.5;
  ctx.globalAlpha *= 0.4;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i/8)*Math.PI*2 - Math.PI/8;
    const x = Math.cos(a)*s*0.5, y = Math.sin(a)*s*0.5;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = (i/8)*Math.PI*2 - Math.PI/8;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s*0.5, Math.sin(a)*s*0.5);
    ctx.lineTo(Math.cos(a)*s*0.92, Math.sin(a)*s*0.92);
    ctx.stroke();
  }
  ctx.globalAlpha /= 0.4;

  // 折射
  const refGrad = ctx.createLinearGradient(-s, -s*0.3, s, s*0.3);
  refGrad.addColorStop(0, 'transparent');
  refGrad.addColorStop(0.35, 'transparent');
  refGrad.addColorStop(0.45, c.refract);
  refGrad.addColorStop(0.55, c.refract);
  refGrad.addColorStop(0.65, 'transparent');
  refGrad.addColorStop(1, 'transparent');
  ctx.globalAlpha *= 0.22;
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i/8)*Math.PI*2 - Math.PI/8;
    const x = Math.cos(a)*s*0.85, y = Math.sin(a)*s*0.85;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha /= 0.22;

  drawHighlight(s*0.4, -s*0.3, s*0.35, s*0.14);
  drawSpecular(-s*0.18, -s*0.3, s*0.1);
}

// 心形切割宝石
function drawHeartGem(s, c) {
  ctx.beginPath();
  ctx.moveTo(0, s*0.85);
  ctx.bezierCurveTo(-s*1.1, s*0.1, -s*1.0, -s*0.8, 0, -s*0.3);
  ctx.bezierCurveTo(s*1.0, -s*0.8, s*1.1, s*0.1, 0, s*0.85);
  ctx.closePath();
  const grad = ctx.createRadialGradient(-s*0.15, -s*0.15, s*0.1, 0, s*0.1, s*1.1);
  grad.addColorStop(0, c.light);
  grad.addColorStop(0.3, c.main);
  grad.addColorStop(0.7, c.dark);
  grad.addColorStop(1, c.dark);
  ctx.fillStyle = grad;
  ctx.fill();

  // 切面
  ctx.strokeStyle = c.dark; ctx.lineWidth = 0.5;
  ctx.globalAlpha *= 0.35;
  ctx.beginPath();
  ctx.moveTo(0, s*0.5);
  ctx.lineTo(-s*0.5, -s*0.3);
  ctx.moveTo(0, s*0.5);
  ctx.lineTo(s*0.5, -s*0.3);
  ctx.moveTo(0, s*0.5);
  ctx.lineTo(0, -s*0.3);
  ctx.moveTo(-s*0.3, -s*0.05);
  ctx.lineTo(s*0.3, -s*0.05);
  ctx.stroke();
  ctx.globalAlpha /= 0.35;

  // 折射
  ctx.globalAlpha *= 0.2;
  const refGrad = ctx.createLinearGradient(-s*0.5, -s*0.5, s*0.5, s*0.5);
  refGrad.addColorStop(0, 'transparent');
  refGrad.addColorStop(0.3, c.refract);
  refGrad.addColorStop(0.5, c.refract);
  refGrad.addColorStop(0.7, 'transparent');
  refGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  ctx.moveTo(0, s*0.6);
  ctx.bezierCurveTo(-s*0.7, 0, -s*0.6, -s*0.5, 0, -s*0.15);
  ctx.bezierCurveTo(s*0.6, -s*0.5, s*0.7, 0, 0, s*0.6);
  ctx.fill();
  ctx.globalAlpha /= 0.2;

  drawHighlight(s*0.25, -s*0.4, s*0.25, s*0.1);
  drawSpecular(-s*0.3, -s*0.4, s*0.08);
  drawSpecular(s*0.15, -s*0.5, s*0.07);
}

// 菱形切割宝石
function drawDiamondGem(s, c) {
  const hw = s * 0.8, hh = s * 1.1;
  ctx.beginPath();
  ctx.moveTo(0, -hh);
  ctx.lineTo(hw, 0);
  ctx.lineTo(0, hh);
  ctx.lineTo(-hw, 0);
  ctx.closePath();
  const grad = ctx.createRadialGradient(-hw*0.15, -hh*0.15, s*0.1, 0, 0, s);
  grad.addColorStop(0, c.light);
  grad.addColorStop(0.3, c.main);
  grad.addColorStop(0.7, c.dark);
  grad.addColorStop(1, c.dark);
  ctx.fillStyle = grad;
  ctx.fill();

  // 切面
  ctx.strokeStyle = c.dark; ctx.lineWidth = 0.5;
  ctx.globalAlpha *= 0.4;
  // 上三角内切
  ctx.beginPath();
  ctx.moveTo(0, -hh*0.45);
  ctx.lineTo(hw*0.45, 0);
  ctx.lineTo(-hw*0.45, 0);
  ctx.closePath();
  ctx.stroke();
  // 下三角内切
  ctx.beginPath();
  ctx.moveTo(0, hh*0.45);
  ctx.lineTo(hw*0.45, 0);
  ctx.lineTo(-hw*0.45, 0);
  ctx.closePath();
  ctx.stroke();
  // 中线
  ctx.beginPath();
  ctx.moveTo(-hw*0.85, 0);
  ctx.lineTo(hw*0.85, 0);
  ctx.stroke();
  ctx.globalAlpha /= 0.4;

  // 折射
  const refGrad = ctx.createLinearGradient(-hw, -hh*0.3, hw, hh*0.3);
  refGrad.addColorStop(0, 'transparent');
  refGrad.addColorStop(0.3, 'transparent');
  refGrad.addColorStop(0.4, c.refract);
  refGrad.addColorStop(0.6, c.refract);
  refGrad.addColorStop(0.7, 'transparent');
  refGrad.addColorStop(1, 'transparent');
  ctx.globalAlpha *= 0.22;
  ctx.fillStyle = refGrad;
  ctx.beginPath();
  ctx.moveTo(0, -hh*0.8);
  ctx.lineTo(hw*0.6, 0);
  ctx.lineTo(0, hh*0.8);
  ctx.lineTo(-hw*0.6, 0);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha /= 0.22;

  drawHighlight(hw*0.25, -hh*0.35, hw*0.3, hh*0.12);
  drawSpecular(-hw*0.1, -hh*0.5, s*0.09);
}

// 高光弧线
function drawHighlight(x, y, w, h) {
  ctx.save();
  ctx.translate(x, y);
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
  grad.addColorStop(0, 'rgba(255,255,255,0.6)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.2)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, w, h, -0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// 点高光
function drawSpecular(x, y, r) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.3)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
}

// 炸弹宝石
function drawBombGem(cx, cy, type, size, alpha) {
  const s = size * 0.42;
  const colors = GEM_COLORS[type];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;

  // 脉动光环
  const t = (performance.now() % 1000) / 1000;
  const pulseR = s * (1.3 + t * 0.3);
  const pg = ctx.createRadialGradient(0, 0, s*0.5, 0, 0, pulseR);
  pg.addColorStop(0, 'rgba(255,120,0,0.35)');
  pg.addColorStop(0.5, 'rgba(255,80,0,0.15)');
  pg.addColorStop(1, 'rgba(255,50,0,0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(0, 0, pulseR, 0, Math.PI*2); ctx.fill();

  // 基础宝石形状（按原类型）
  ctx.translate(0, 0);
  switch(type) {
    case 0: drawRoundGem(s, colors); break;
    case 1: drawOvalGem(s, colors); break;
    case 2: drawTeardropGem(s, colors); break;
    case 3: drawOctagonGem(s, colors); break;
    case 4: drawHeartGem(s, colors); break;
    case 5: drawDiamondGem(s, colors); break;
  }

  // 炸弹标记 - 火焰十字
  ctx.fillStyle = '#ff8800';
  ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 8;
  ctx.font = `bold ${s*0.7}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🔥', 0, s*0.05);
  ctx.shadowBlur = 0;

  ctx.restore();
}

// 彩虹宝石
function drawRainbowGem(cx, cy, size, alpha) {
  const s = size * 0.42;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;

  // 彩虹光环旋转
  const t = (performance.now() % 2000) / 2000;
  const angle = t * Math.PI * 2;

  // 外圈彩虹光
  for (let i = 0; i < 6; i++) {
    const a = angle + (i/6) * Math.PI * 2;
    const c = GEM_COLORS[i];
    ctx.fillStyle = c.glow;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*s*0.3, Math.sin(a)*s*0.3, s*0.5, 0, Math.PI*2);
    ctx.fill();
  }

  // 中心白钻
  const grad = ctx.createRadialGradient(-s*0.15, -s*0.15, s*0.05, 0, 0, s*0.7);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.3, '#e0d0ff');
  grad.addColorStop(0.6, '#c0a0f0');
  grad.addColorStop(1, '#8060c0');
  ctx.fillStyle = grad;
  // 画菱形
  ctx.beginPath();
  ctx.moveTo(0, -s*0.7);
  ctx.lineTo(s*0.55, 0);
  ctx.lineTo(0, s*0.7);
  ctx.lineTo(-s*0.55, 0);
  ctx.closePath();
  ctx.fill();

  // 折射彩虹
  ctx.globalAlpha *= 0.4;
  for (let i = 0; i < 6; i++) {
    const a = -angle + (i/6) * Math.PI * 2;
    const c = GEM_COLORS[i];
    ctx.fillStyle = c.refract;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - 0.25)*s*0.6, Math.sin(a - 0.25)*s*0.6);
    ctx.lineTo(Math.cos(a + 0.25)*s*0.6, Math.sin(a + 0.25)*s*0.6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha /= 0.4;

  // 高光
  drawHighlight(s*0.1, -s*0.3, s*0.25, s*0.08);
  drawSpecular(-s*0.08, -s*0.4, s*0.06);

  ctx.restore();
}

// ============ 棋盘 ============
function createCell(type, special = null) {
  return { type, special, scale: 1, alpha: 1, offsetX: 0, offsetY: 0, shake: 0 };
}

function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = Math.floor(Math.random() * GEM_COUNT);
      } while (wouldMatch(r, c, type));
      board[r][c] = createCell(type);
    }
  }
}

function wouldMatch(r, c, type) {
  if (c >= 2 && board[r][c-1]?.type === type && board[r][c-2]?.type === type) return true;
  if (r >= 2 && board[r-1]?.[c]?.type === type && board[r-2]?.[c]?.type === type) return true;
  return false;
}

// ============ 匹配检测 ============
function findMatches() {
  const matches = new Set();
  const matchGroups = [];

  // 横向
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const cell = board[r][c];
      if (!cell || cell.special === SPECIAL_RAINBOW) { c++; continue; }
      let end = c + 1;
      while (end < COLS && board[r][end] && board[r][end].type === cell.type && board[r][end].special !== SPECIAL_RAINBOW) {
        end++;
      }
      const len = end - c;
      if (len >= 3) {
        const group = [];
        for (let i = c; i < end; i++) { matches.add(`${r},${i}`); group.push({r, c:i}); }
        matchGroups.push({ cells: group, dir: 'h', length: len });
      }
      c = end;
    }
  }

  // 纵向
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const cell = board[r][c];
      if (!cell || cell.special === SPECIAL_RAINBOW) { r++; continue; }
      let end = r + 1;
      while (end < ROWS && board[end][c] && board[end][c].type === cell.type && board[end][c].special !== SPECIAL_RAINBOW) {
        end++;
      }
      const len = end - r;
      if (len >= 3) {
        const group = [];
        for (let i = r; i < end; i++) { matches.add(`${i},${c}`); group.push({r:i, c}); }
        matchGroups.push({ cells: group, dir: 'v', length: len });
      }
      r = end;
    }
  }

  return { matches, matchGroups };
}

// ============ 特殊宝石生成 ============
function determineSpecial(matchGroup, swappedCell) {
  const cells = matchGroup.cells;
  if (matchGroup.length === 4) {
    const pos = swappedCell && cells.find(c => c.r === swappedCell.r && c.c === swappedCell.c) ? swappedCell : cells[1];
    return { pos, special: SPECIAL_BOMB };
  }
  if (matchGroup.length >= 5) {
    const pos = swappedCell && cells.find(c => c.r === swappedCell.r && c.c === swappedCell.c) ? swappedCell : cells[2];
    return { pos, special: SPECIAL_RAINBOW };
  }
  return null;
}

// ============ 消除与掉落 ============
async function processMatches(swappedCell = null) {
  animating = true;
  try {
    let { matches, matchGroups } = findMatches();

    if (matches.size === 0) { animating = false; return false; }

    combo++;
    if (combo > maxCombo) maxCombo = combo;

    const specials = [];
    for (const group of matchGroups) {
      const sp = determineSpecial(group, swappedCell);
      if (sp) specials.push(sp);
    }

    // 触发特殊效果
    let extraMatches = new Set();
    for (const key of matches) {
      const [r, c] = key.split(',').map(Number);
      const cell = board[r][c];
      if (!cell) continue;
      if (cell.special === SPECIAL_BOMB) {
        playBombSound();
        for (let cc = 0; cc < COLS; cc++) extraMatches.add(`${r},${cc}`);
      }
      if (cell.special === SPECIAL_RAINBOW) {
        playRainbowSound();
        const targetType = cell.type;
        for (let rr = 0; rr < ROWS; rr++)
          for (let cc = 0; cc < COLS; cc++)
            if (board[rr][cc] && board[rr][cc].type === targetType) extraMatches.add(`${rr},${cc}`);
      }
    }
    for (const key of extraMatches) matches.add(key);

    const multiplier = getMultiplier();
    const pts = matches.size * 10 * multiplier;
    score += pts;
    updateUI();

    playMatchSound(combo);
    if (combo >= 2) playComboSound(combo);
    showScorePopup(pts, multiplier);

    const matchArr = [...matches].map(k => k.split(',').map(Number));
    await animateElimination(matchArr);

    // 保留特殊宝石位置
    const specialPositions = new Map();
    for (const sp of specials) {
      const cell = board[sp.pos.r][sp.pos.c];
      specialPositions.set(`${sp.pos.r},${sp.pos.c}`, { special: sp.special, type: cell ? cell.type : 0 });
    }

    for (const [r, c] of matchArr) board[r][c] = null;

    // 放置特殊宝石
    for (const [key, info] of specialPositions) {
      const [r, c] = key.split(',').map(Number);
      if (!board[r][c]) {
        board[r][c] = createCell(info.type, info.special);
        board[r][c].scale = 1.3;
        board[r][c].alpha = 1;
      }
    }

    await applyGravity();
    await fillEmpty();

    // 特殊宝石入场缩放
    await new Promise(resolve => {
      const start = performance.now();
      function frame(now) {
        const t = Math.min((now - start) / 200, 1);
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (board[r][c] && board[r][c].special && board[r][c].scale > 1)
              board[r][c].scale = 1 + (1 - t) * 0.3;
        render();
        if (t < 1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });

    const nextMatches = findMatches();
    if (nextMatches.matches.size > 0) {
      await delay(150);
      await processMatches(null);
    } else {
      combo = 0;
      updateUI();
    }

    animating = false;
    return true;
  } catch (e) {
    console.error('processMatches error:', e);
    animating = false;
    combo = 0;
    updateUI();
    return false;
  }
}

function getMultiplier() {
  if (combo <= 1) return 1;
  if (combo === 2) return 1.5;
  if (combo === 3) return 2;
  if (combo === 4) return 3;
  return Math.min(combo, 10);
}

async function animateElimination(cells) {
  return new Promise(resolve => {
    const start = performance.now();
    const dur = 300;
    function frame(now) {
      const t = Math.min((now - start) / dur, 1);
      for (const [r, c] of cells) {
        if (board[r][c]) {
          board[r][c].scale = 1 - t * 0.8;
          board[r][c].alpha = 1 - t;
        }
      }
      render();
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

async function applyGravity() {
  let moved = true;
  while (moved) {
    moved = false;
    for (let c = 0; c < COLS; c++)
      for (let r = ROWS-1; r > 0; r--)
        if (!board[r][c] && board[r-1][c]) {
          board[r][c] = board[r-1][c]; board[r-1][c] = null; moved = true;
        }
  }
  await animateFall();
}

async function animateFall() {
  return new Promise(resolve => {
    const start = performance.now();
    const dur = 220;
    function frame(now) {
      const t = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (board[r][c]) {
            board[r][c].offsetY = (1 - ease) * -8;
            board[r][c].scale = 0.85 + 0.15 * ease;
          }
      render();
      if (t < 1) requestAnimationFrame(frame);
      else {
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (board[r][c]) { board[r][c].offsetY = 0; board[r][c].scale = 1; }
        render(); resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

async function fillEmpty() {
  for (let c = 0; c < COLS; c++)
    for (let r = 0; r < ROWS; r++)
      if (!board[r][c]) {
        board[r][c] = createCell(Math.floor(Math.random() * GEM_COUNT));
        board[r][c].scale = 0; board[r][c].alpha = 0;
      }

  await new Promise(resolve => {
    const start = performance.now();
    const dur = 280;
    function frame(now) {
      const t = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - t, 2);
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (board[r][c] && board[r][c].scale < 1) {
            board[r][c].scale = ease;
            board[r][c].alpha = ease;
          }
      render();
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

// ============ 交换 ============
async function swapCells(r1, c1, r2, c2) {
  const temp = board[r1][c1]; board[r1][c1] = board[r2][c2]; board[r2][c2] = temp;
  playSwapSound();
  await animateSwap(r1, c1, r2, c2);
}

async function animateSwap(r1, c1, r2, c2) {
  return new Promise(resolve => {
    const start = performance.now(); const dur = 180;
    const dx = (c2 - c1) * CELL, dy = (r2 - r1) * CELL;
    function frame(now) {
      const t = Math.min((now - start) / dur, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      if (board[r1][c1]) { board[r1][c1].offsetX = -dx*(1-ease); board[r1][c1].offsetY = -dy*(1-ease); }
      if (board[r2][c2]) { board[r2][c2].offsetX = dx*(1-ease); board[r2][c2].offsetY = dy*(1-ease); }
      render();
      if (t < 1) requestAnimationFrame(frame);
      else {
        if (board[r1][c1]) { board[r1][c1].offsetX=0; board[r1][c1].offsetY=0; }
        if (board[r2][c2]) { board[r2][c2].offsetX=0; board[r2][c2].offsetY=0; }
        render(); resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

async function trySwap(r1, c1, r2, c2) {
  if (animating || !gameRunning) return;
  if (r2<0||r2>=ROWS||c2<0||c2>=COLS) return;
  if (Math.abs(r1-r2)+Math.abs(c1-c2)!==1) return;

  animating = true; combo = 0;
  await swapCells(r1, c1, r2, c2);

  const { matches } = findMatches();
  if (matches.size > 0) {
    const swappedCell = { r: r2, c: c2 };
    await processMatches(swappedCell);
  } else {
    playInvalidSwapSound();
    await delay(150);
    await swapCells(r1, c1, r2, c2);
    board[r1][c1].shake = 5; board[r2][c2].shake = 5;
    render(); await delay(80);
    board[r1][c1].shake = 0; board[r2][c2].shake = 0;
    render();
  }
  selected = null; animating = false;
}

// ============ 渲染 ============
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 棋盘背景
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = BOARD_X + c * CELL, y = BOARD_Y + r * CELL;
      const dark = (r + c) % 2 === 0;
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 6);
      ctx.fill();
    }
  }

  // 选中高亮
  if (selected && board[selected.r] && board[selected.r][selected.c]) {
    const x = BOARD_X + selected.c * CELL, y = BOARD_Y + selected.r * CELL;
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(x+1, y+1, CELL-2, CELL-2, 8); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,215,0,0.1)';
    ctx.beginPath(); ctx.roundRect(x+1, y+1, CELL-2, CELL-2, 8); ctx.fill();
  }

  // 锤子模式
  if (toolMode === 'hammer') {
    ctx.fillStyle = 'rgba(255,100,0,0.06)';
    ctx.fillRect(BOARD_X, BOARD_Y, BOARD_SIZE, BOARD_SIZE);
  }

  // 绘制宝石
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = board[r][c];
      if (!cell) continue;
      const cx = BOARD_X + c*CELL + CELL/2 + (cell.offsetX||0);
      const cy = BOARD_Y + r*CELL + CELL/2 + (cell.offsetY||0);
      const shake = cell.shake || 0;
      const sx = shake ? (Math.random()-0.5)*shake : 0;

      if (cell.special === SPECIAL_RAINBOW) {
        drawRainbowGem(cx + sx, cy, CELL * cell.scale, cell.alpha);
      } else if (cell.special === SPECIAL_BOMB) {
        drawBombGem(cx + sx, cy, cell.type, CELL * cell.scale, cell.alpha);
      } else {
        drawGem(cx + sx, cy, cell.type, CELL * cell.scale, cell.alpha);
      }
    }
  }
}

// ============ UI ============
function updateUI() {
  document.getElementById('score-val').textContent = score;
  const comboEl = document.getElementById('combo-val');
  comboEl.textContent = combo;
  comboEl.classList.toggle('pop', combo > 0);
  setTimeout(() => comboEl.classList.remove('pop'), 200);

  const timerEl = document.getElementById('timer-val');
  timerEl.textContent = timeLeft;
  timerEl.classList.toggle('warning', timeLeft <= 10);

  const multEl = document.getElementById('combo-multiplier');
  if (combo >= 2) {
    multEl.textContent = `x${getMultiplier()} COMBO!`;
    multEl.classList.add('show');
  } else multEl.classList.remove('show');

  document.getElementById('hammer-count').textContent = tools.hammer;
  document.getElementById('shuffle-count').textContent = tools.shuffle;
  document.getElementById('time-count').textContent = tools.time;
  document.getElementById('tool-hammer').classList.toggle('disabled', tools.hammer <= 0);
  document.getElementById('tool-shuffle').classList.toggle('disabled', tools.shuffle <= 0);
  document.getElementById('tool-time').classList.toggle('disabled', tools.time <= 0);
  document.getElementById('tool-hammer').style.background = toolMode === 'hammer' ? 'rgba(255,100,0,0.25)' : '';
}

function showScorePopup(pts, multiplier) {
  const popup = document.createElement('div');
  popup.className = 'score-popup';
  popup.style.fontSize = `${18 + combo * 3}px`;
  popup.textContent = `+${pts}${multiplier > 1 ? ` (x${multiplier})` : ''}`;
  popup.style.left = `${canvas.offsetLeft + BOARD_SIZE/2 - 40}px`;
  popup.style.top = `${canvas.offsetTop + BOARD_SIZE/2}px`;
  document.getElementById('game-container').appendChild(popup);
  setTimeout(() => popup.remove(), 800);
}

// ============ 道具 ============
async function useTool(type) {
  if (!gameRunning || animating) return;

  if (type === 'hammer') {
    if (tools.hammer <= 0) return;
    if (toolMode === 'hammer') { toolMode = null; updateUI(); return; }
    toolMode = 'hammer'; selected = null; updateUI(); render(); return;
  }

  if (type === 'shuffle') {
    if (tools.shuffle <= 0) return;
    tools.shuffle--; playShuffleSound(); animating = true;
    const allCells = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c]) allCells.push(board[r][c]);
    for (let i = allCells.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [allCells[i], allCells[j]] = [allCells[j], allCells[i]];
    }
    let idx = 0;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        board[r][c] = allCells[idx++];
        board[r][c].scale = 0; board[r][c].alpha = 0;
      }
    let safety = 0;
    while (safety < 100) {
      const { matches } = findMatches();
      if (matches.size === 0) break;
      for (let i = allCells.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [allCells[i], allCells[j]] = [allCells[j], allCells[i]];
      }
      idx = 0;
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) { board[r][c] = allCells[idx++]; board[r][c].scale = 0; board[r][c].alpha = 0; }
      safety++;
    }
    await fillEmpty();
    animating = false; updateUI(); return;
  }

  if (type === 'time') {
    if (tools.time <= 0) return;
    tools.time--; timeLeft += 15; playTimeSound(); updateUI(); return;
  }
}

async function hammerClick(r, c) {
  if (!board[r][c]) return;
  tools.hammer--; toolMode = null; playHammerSound(); animating = true;
  board[r][c].scale = 1; board[r][c].alpha = 1;
  await animateElimination([[r, c]]);
  board[r][c] = null;
  await applyGravity(); await fillEmpty();
  const { matches } = findMatches();
  if (matches.size > 0) { combo = 1; await processMatches(null); }
  animating = false; updateUI(); render();
}

// ============ 输入 ============
canvas.addEventListener('click', (e) => {
  if (!gameRunning || animating) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const c = Math.floor((x - BOARD_X) / CELL), r = Math.floor((y - BOARD_Y) / CELL);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

  if (toolMode === 'hammer') { hammerClick(r, c); return; }

  if (!selected) { selected = { r, c }; render(); }
  else {
    if (selected.r === r && selected.c === c) { selected = null; render(); return; }
    if (Math.abs(selected.r-r) + Math.abs(selected.c-c) === 1) trySwap(selected.r, selected.c, r, c);
    else { selected = { r, c }; render(); }
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  canvas.dispatchEvent(new MouseEvent('click', { clientX: touch.clientX, clientY: touch.clientY }));
}, { passive: false });

// ============ 计时 ============
function startTimer() {
  timerInterval = setInterval(() => {
    if (!gameRunning) return;
    timeLeft--; updateUI();
    if (timeLeft <= 10) startHeartbeat();
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  gameRunning = false; stopHeartbeat(); clearInterval(timerInterval);
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').classList.add('show');
}

function startGame() {
  score = 0; combo = 0; maxCombo = 0; timeLeft = 60;
  tools = { hammer: 3, shuffle: 2, time: 1 };
  selected = null; toolMode = null; animating = false; gameRunning = true;
  initBoard(); updateUI(); render(); startTimer();
  // 持续渲染（特殊宝石动画）
  requestAnimationFrame(animLoop);
}

function animLoop() {
  if (!gameRunning) return;
  // 只在有特殊宝石时重绘（它们有脉动动画）
  let hasSpecial = false;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c] && board[r][c].special) hasSpecial = true;
  if (hasSpecial && !animating) render();
  requestAnimationFrame(animLoop);
}

function restartGame() {
  document.getElementById('game-over').classList.remove('show');
  clearInterval(timerInterval); stopHeartbeat(); startGame();
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

startGame();
window.addEventListener('resize', () => { calcSize(); render(); });
</script>
